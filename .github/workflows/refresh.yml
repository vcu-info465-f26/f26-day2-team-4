name: Daily refresh

on:
  schedule:
    - cron: "17 11 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REFRESH_TOKEN1 }}
      - name: Pull latest changes
        run: git pull --rebase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: pip install groq

      - name: Fetch today's snapshot
        run: python src/fetch.py
      - name: Generate music summary
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/summarize.py

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git push
